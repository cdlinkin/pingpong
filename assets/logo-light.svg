<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.p{fill:none;stroke:#212529;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.b{fill:#212529}
.t{fill:#212529;font-family:"Segoe UI",Manrope,Helvetica,Arial,sans-serif;font-size:36px;letter-spacing:-1px}
.x{animation:x 1.2s ease-in-out infinite alternate}
.y{animation:y 1.2s infinite}
.l,.r,.x,.y{transform-box:view-box}
.l{transform-origin:8px 36px;animation:l 2.4s infinite}
.r{transform-origin:72px 36px;animation:r 2.4s infinite}
@keyframes x{from{transform:translateX(-7.5px)}to{transform:translateX(7.5px)}}
@keyframes y{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-9px);animation-timing-function:cubic-bezier(.6,0,.8,.3)}100%{transform:translateY(0)}}
@keyframes l{0%,100%{transform:rotate(0)}4%{transform:rotate(-7deg)}14%{transform:rotate(2deg)}22%{transform:rotate(0)}}
@keyframes r{0%,48%,72%,100%{transform:rotate(0)}54%{transform:rotate(7deg)}64%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<svg x="0" y="4" width="100" height="58" viewBox="0 -6 80 46">
<g class="l"><path class="p" d="M8 35V13a8 8 0 1 1 8 8H8"/></g>
<g class="r"><path class="p" d="M72 35V13a8 8 0 1 0-8 8h8"/></g>
<g class="x"><g class="y"><circle class="b" cx="40" cy="13" r="4"/></g></g>
</svg>
<text class="t" x="114" y="44"><tspan font-weight="800">Ping</tspan><tspan font-weight="400">Pong</tspan></text>
</svg>
