basePath: /
definitions:
  HealthResponse:
    properties:
      status:
        example: OK
        type: string
    type: object
  Message:
    properties:
      chat_id:
        example: 13
        type: integer
      created_at:
        example: "2026-10-28T18:34:54Z"
        type: string
      deleted:
        example: false
        type: boolean
      edited_at:
        example: "2026-10-28T18:40:12Z"
        type: string
      id:
        example: 120
        type: integer
      message:
        example: Привет!
        type: string
      user_id:
        example: 38
        type: integer
    type: object
  MessageRequest:
    properties:
      message:
        example: Привет!
        maxLength: 500
        minLength: 1
        type: string
    type: object
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.loginResponse:
    properties:
      token:
        type: string
    type: object
  auth.meResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      login:
        type: string
    type: object
  auth.registerRequest:
    properties:
      email:
        type: string
      login:
        type: string
      password:
        type: string
    type: object
  auth.registerResponse:
    properties:
      id:
        type: integer
    type: object
  chats.addMemberRequest:
    properties:
      user_id:
        type: integer
    type: object
  chats.chatResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  chats.createChatResponse:
    properties:
      id:
        type: integer
    type: object
  chats.createDirectRequest:
    properties:
      user_id:
        type: integer
    type: object
  chats.createGroupRequest:
    properties:
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    REST API веб-мессенджера PingPong: регистрация и JWT-авторизация, личные и групповые чаты, сообщения с курсорной пагинацией и поиском, доставка в реальном времени через WebSocket.

    **Как авторизоваться:** выполните `POST /login`, нажмите **Authorize** и вставьте `Bearer <token>`.

    **Ошибки** возвращаются обычным текстом (`text/plain`), например `chat not found`. Если вы не участник чата, API отвечает 404, чтобы не раскрывать, что чат существует.
  title: PingPong API
  version: "1.0"
paths:
  /chats:
    get:
      description: Список чатов, в которых состоит текущий пользователь. У личных
        чатов `title` равен null.
      produces:
      - application/json
      responses:
        "200":
          description: Список чатов (может быть пустым)
          schema:
            items:
              $ref: '#/definitions/chats.chatResponse'
            type: array
        "401":
          description: invalid token
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Мои чаты
      tags:
      - chats
  /chats/{id}/members:
    post:
      consumes:
      - application/json
      description: Добавляет пользователя в групповой чат. Доступно только админу
        чата. Если вы не участник чата, ответ 404.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: id добавляемого пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chats.addMemberRequest'
      responses:
        "204":
          description: Участник добавлен
        "400":
          description: Невалидный id чата или JSON
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "403":
          description: only admin can add members
          schema:
            type: string
        "404":
          description: chat not found / user not found
          schema:
            type: string
        "409":
          description: user is already a member
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Добавить участника
      tags:
      - chats
  /chats/{id}/members/{userID}:
    delete:
      description: Удаляет пользователя из чата. Доступно только админу чата, удалить
        самого себя нельзя.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: ID удаляемого пользователя
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: Участник удалён
        "400":
          description: Невалидный id или cannot remove yourself
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "403":
          description: only admin can remove members
          schema:
            type: string
        "404":
          description: chat not found / member not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Удалить участника
      tags:
      - chats
  /chats/{id}/messages:
    get:
      description: Курсорная пагинация от новых к старым. Для следующей страницы передайте
        в `before` id самого старого сообщения из текущей.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: Вернуть сообщения с id меньше этого
        in: query
        name: before
        type: integer
      - description: 'Размер страницы: по умолчанию 50, максимум 100'
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Страница сообщений
          schema:
            items:
              $ref: '#/definitions/Message'
            type: array
        "400":
          description: invalid before / invalid limit
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "404":
          description: chat not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: История сообщений
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Сохраняет сообщение в чате. Отправитель должен быть участником
        чата. Для доставки собеседникам в реальном времени используйте WebSocket `/ws`.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: Текст сообщения (1–500 символов)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Сообщение сохранено
          schema:
            $ref: '#/definitions/Message'
        "400":
          description: message must be 1-500 symbols
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "404":
          description: chat not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Отправить сообщение (HTTP)
      tags:
      - messages
  /chats/{id}/messages/{msgID}:
    delete:
      description: 'Мягкое удаление своего сообщения: строка остаётся в базе с `deleted_at`,
        а в истории сообщение приходит с `"deleted": true` и пустым текстом. В поиск
        удалённые не попадают. Участники чата онлайн получают по WebSocket событие
        `{"type":"message.deleted","chat_id":13,"id":120}`.'
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: ID сообщения
        in: path
        name: msgID
        required: true
        type: integer
      responses:
        "204":
          description: Сообщение удалено
        "400":
          description: invalid message id
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "404":
          description: chat not found / message not found (чужое, уже удалённое или
            не существует)
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Удалить сообщение
      tags:
      - messages
    patch:
      consumes:
      - application/json
      description: Меняет текст своего сообщения и ставит `edited_at`. Изменить можно
        только своё и не удалённое сообщение. Участники чата онлайн получают по WebSocket
        событие `{"type":"message.edited","message":{...}}`.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: ID сообщения
        in: path
        name: msgID
        required: true
        type: integer
      - description: Новый текст (1–500 символов)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/MessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение изменено
          schema:
            $ref: '#/definitions/Message'
        "400":
          description: message must be 1-500 symbols
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "404":
          description: chat not found / message not found (чужое, удалённое или не
            существует)
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Изменить сообщение
      tags:
      - messages
  /chats/{id}/messages/search:
    get:
      description: Ищет подстроку в сообщениях чата без учёта регистра. Возвращает
        до 50 последних совпадений.
      parameters:
      - description: ID чата
        in: path
        name: id
        required: true
        type: integer
      - description: Текст для поиска (1–100 символов)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Найденные сообщения
          schema:
            items:
              $ref: '#/definitions/Message'
            type: array
        "400":
          description: query must be 1-100 symbols
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "404":
          description: chat not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Поиск по сообщениям
      tags:
      - messages
  /chats/direct:
    post:
      consumes:
      - application/json
      description: Если личный чат с этим пользователем уже есть, возвращает его id
        со статусом 200. Иначе создаёт новый и отвечает 201. Чат с самим собой создать
        нельзя.
      parameters:
      - description: id собеседника
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chats.createDirectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Чат уже существовал
          schema:
            $ref: '#/definitions/chats.createChatResponse'
        "201":
          description: Чат создан
          schema:
            $ref: '#/definitions/chats.createChatResponse'
        "400":
          description: Невалидный JSON или чат с самим собой
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "404":
          description: user not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 'Личный чат: найти или создать'
      tags:
      - chats
  /chats/group:
    post:
      consumes:
      - application/json
      description: Создаёт группу. Создатель автоматически становится участником с
        ролью `admin`.
      parameters:
      - description: Название группы (1–50 символов)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/chats.createGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Группа создана
          schema:
            $ref: '#/definitions/chats.createChatResponse'
        "400":
          description: Невалидный JSON или название
          schema:
            type: string
        "401":
          description: invalid token
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Создать групповой чат
      tags:
      - chats
  /health:
    get:
      description: Отвечает `{"status":"OK"}`, если сервер запущен.
      produces:
      - application/json
      responses:
        "200":
          description: Сервер работает
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Проверка состояния
      tags:
      - system
  /login:
    post:
      consumes:
      - application/json
      description: 'Проверяет email и пароль и выдаёт JWT (HS256, живёт 24 часа).
        Токен передаётся в заголовке `Authorization: Bearer <token>`.'
      parameters:
      - description: Email и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JWT
          schema:
            $ref: '#/definitions/auth.loginResponse'
        "400":
          description: Невалидный JSON или данные
          schema:
            type: string
        "401":
          description: invalid email or password
          schema:
            type: string
        "405":
          description: method not allowed
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Вход
      tags:
      - auth
  /me:
    get:
      description: Возвращает профиль владельца токена.
      produces:
      - application/json
      responses:
        "200":
          description: Профиль
          schema:
            $ref: '#/definitions/auth.meResponse'
        "401":
          description: invalid token
          schema:
            type: string
        "404":
          description: user not found
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя. Логин 3–25 символов, корректный email,
        пароль от 8 до 72 байт (ограничение bcrypt).
      parameters:
      - description: Данные нового пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/auth.registerResponse'
        "400":
          description: Невалидный JSON или данные
          schema:
            type: string
        "405":
          description: method not allowed
          schema:
            type: string
        "409":
          description: user already exists
          schema:
            type: string
        "500":
          description: internal error
          schema:
            type: string
      summary: Регистрация
      tags:
      - auth
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 'JWT из POST /login. Формат: `Bearer <token>`'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Служебные эндпоинты
  name: system
- description: Регистрация, вход и профиль
  name: auth
- description: Личные и групповые чаты, участники
  name: chats
- description: Отправка, история и поиск сообщений
  name: messages
- description: WebSocket
  name: realtime
