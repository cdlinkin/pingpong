services:

  pingpong-postgres:
    image: postgres:18
    container_name: pingpong_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    restart: always

volumes:
  pgdata:
